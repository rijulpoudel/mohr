[project]
name = "mohr-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django==5.2.17",
    "django-environ>=0.12,<1",
    "djangorestframework==3.17.2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
